[tox]
envlist =
    flake8
    py{39,310,311,312,313}-dj{32,42,50}-{postgresql,mysql}

[testenv]
deps =
    dj32: Django==3.2.*
    dj42: Django==4.2.*
    dj50: Django==5.0.*
    postgresql: psycopg2-binary
    mysql: mysqlclient
    coverage
setenv =
    PYTHONPATH = {toxinidir}
    postgresql: DJANGO_SETTINGS_MODULE = settings_postgresql
    mysql: DJANGO_SETTINGS_MODULE = settings_mysql
whitelist_externals = make
pip_pre = True
commands = make coverage TEST_ARGS='{posargs:tests}'

[testenv:flake8]
basepython = python3
commands = make flake8
deps = flake8
skip_install = true

[testenv:style]
basepython = python3
commands = make style_check
deps =
    black>=19.10b0
    flake8
skip_install = true
